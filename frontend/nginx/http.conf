# Mode HTTP seul — utilise lorsqu'aucun certificat n'est fourni.
server {
    listen 80;
    # "localhost" resout d'abord vers ::1 dans le conteneur : sans cette ligne,
    # le health check echouerait sur une pile purement IPv4.
    listen [::]:80;
    server_name _;

    include /etc/nginx/snippets/locations.conf;
}
