# Blocs communs aux modes HTTP et HTTPS (inclus par les deux configurations).

root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

client_max_body_size 8m;

# En-tetes de securite de base
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;

# Application React (routes gerees cote client)
location / {
    try_files $uri $uri/ /index.html;
}

location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|webp)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
}

# API et fichiers televerses servis par le backend
location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location /uploads/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
}

location /swagger-ui/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
}

location /v3/api-docs {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
}
