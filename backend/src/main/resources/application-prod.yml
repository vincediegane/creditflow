# =====================================================================
# Profil PRODUCTION (boutique reelle)
# L'application refuse de demarrer si un secret de livraison subsiste.
# =====================================================================
app:
  security:
    strict: true
  demo:
    # Aucune donnee de demonstration chez un client.
    seed: ${DEMO_SEED:false}
  admin:
    # Le commercant definit son propre mot de passe a la premiere connexion,
    # afin que l'installateur ne conserve aucun acces.
    force-password-change: ${ADMIN_FORCE_PASSWORD_CHANGE:true}

spring:
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.creditflow: INFO
    org.springframework.web: WARN

server:
  error:
    # Ne pas exposer les messages techniques aux clients HTTP.
    include-message: never
    include-stacktrace: never
