server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: creditflow
  profiles:
    # demo : donnees de demonstration et secrets par defaut tolerés.
    # prod : aucune donnee de demonstration, secrets de livraison refusés.
    active: ${SPRING_PROFILES_ACTIVE:demo}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/creditflow}
    username: ${DB_USERNAME:creditflow}
    password: ${DB_PASSWORD:creditflow}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          # Aligne le driver sur le fuseau de l'application (variable TZ du conteneur)
          # afin que les horodatages stockes correspondent a l'heure de la boutique.
          time_zone: ${TZ:Africa/Dakar}
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.creditflow: INFO

app:
  security:
    jwt:
      secret: ${JWT_SECRET:creditflow-super-secret-key-change-me-in-production-0123456789}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
      issuer: creditflow
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3010,http://localhost}
  storage:
    upload-dir: ${UPLOAD_DIR:./data/uploads}
    public-path: /uploads
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    full-name: ${ADMIN_FULL_NAME:Administrateur Boutique}
  shop:
    name: ${SHOP_NAME:CreditFlow Boutique}
    currency: FCFA
  reminder:
    default-template: |
      Bonjour {{nom}},
      Nous vous rappelons que votre versement mensuel de {{montant}} {{devise}} est attendu entre le {{jour_debut}} et le {{jour_fin}} du mois.
      Merci pour votre confiance.
      {{boutique}}
    window-start-day: 1
    window-end-day: 10
  demo:
    seed: ${DEMO_SEED:true}
