server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
  tomcat:
    max-swallow-size: 15MB

spring:
  application:
    name: creditflow
  profiles:
    # demo : donnees de demonstration et secrets par defaut tolerés.
    # prod : aucune donnee de demonstration, secrets de livraison refusés.
    active: ${SPRING_PROFILES_ACTIVE:demo}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/creditflow}
    username: ${DB_USERNAME:creditflow}
    password: ${DB_PASSWORD:creditflow}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          # Aligne le driver sur le fuseau de l'application (variable TZ du conteneur)
          # afin que les horodatages stockes correspondent a l'heure de la boutique.
          time_zone: ${TZ:Africa/Dakar}
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.creditflow: INFO

app:
  security:
    jwt:
      secret: ${JWT_SECRET:creditflow-super-secret-key-change-me-in-production-0123456789}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
      issuer: creditflow
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3010,http://localhost}
  storage:
    upload-dir: ${UPLOAD_DIR:./data/uploads}
    public-path: /uploads
    provider: ${STORAGE_PROVIDER:local}
    s3:
      bucket: ${STORAGE_S3_BUCKET:}
      region: ${STORAGE_S3_REGION:}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
      endpoint: ${STORAGE_S3_ENDPOINT:}
      path-style-access: ${STORAGE_S3_PATH_STYLE_ACCESS:false}
      signed-url-ttl-seconds: ${STORAGE_SIGNED_URL_TTL_SECONDS:300}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    full-name: ${ADMIN_FULL_NAME:Administrateur Boutique}
  shop:
    name: ${SHOP_NAME:CreditFlow Boutique}
    currency: FCFA
  reminder:
    default-template: |
      Bonjour {{nom}},
      Nous vous rappelons que votre versement mensuel de {{montant}} {{devise}} est attendu entre le {{jour_debut}} et le {{jour_fin}} du mois.
      Merci pour votre confiance.
      {{boutique}}
    window-start-day: 1
    window-end-day: 10
  notification:
    channel: ${NOTIFICATION_CHANNEL:manual}
    default-country-code: ${NOTIFICATION_DEFAULT_COUNTRY_CODE:+221}
    whatsapp:
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      access-token: ${WHATSAPP_ACCESS_TOKEN:}
      api-base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com}
      api-version: ${WHATSAPP_API_VERSION:v20.0}
      template-name: ${WHATSAPP_TEMPLATE_NAME:relance_creditflow}
      template-language-code: ${WHATSAPP_TEMPLATE_LANGUAGE_CODE:fr}
  demo:
    seed: ${DEMO_SEED:true}
  plan:
    multi-shop: ${PLAN_MULTI_SHOP:true}
    whatsapp-auto: ${PLAN_WHATSAPP_AUTO:true}
